services:
  squire-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: squire-core
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      HEALTH_HOST: "0.0.0.0"
      HEALTH_PORT: "${HEALTH_PORT:-8080}"
    ports:
      - "${HEALTH_PORT:-8080}:${HEALTH_PORT:-8080}"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./config:/app/config:ro
      - ./archive:/data/archive
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import os,urllib.request as u;p=os.getenv('HEALTH_PORT','8080');r=u.urlopen(f'http://127.0.0.1:{p}/health',timeout=3);c=r.getcode();r.close();raise SystemExit(0 if c==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
