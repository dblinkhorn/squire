[project]
name = "squire"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.0", "pyyaml>=6.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
